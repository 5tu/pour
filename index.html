<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="msapplication-TileImage" content="favicon/android-chrome-192x192.png">

</head>
<body>
    <div class="container">
        <!-- Control Panel -->
        <div class="controls">
            <select id="recipeSelect"></select>
            <div class="button-group">
                <button id="startBtn" disabled>Start</button>
                <button id="stopBtn" disabled>Stop</button>
                <button id="resetBtn" disabled>Reset</button>
            </div>
        </div>

        <!-- Timeline Container -->
        <div class="timeline-wrapper">
            <div class="timeline-message timeline-message-top" id="topMessage" aria-hidden="true">Get ready!</div>
            <div class="timeline-indicator-container" aria-hidden="true">
                <div class="timeline-indicator" role="status" aria-live="polite"></div>
            </div>
            <div class="timeline-scroll" id="timelineScroll">
                <div class="timeline-content" id="timelineContent">
                    <!-- Timeline items will be inserted here -->
                </div>
            </div>
            <div class="timeline-message timeline-message-bottom" id="bottomMessage" aria-hidden="true">Enjoy your coffee!</div>

            <!-- Wake lock status icon (bottom-left) -->
            <div id="wakeIcon" class="wake-icon" role="status" aria-hidden="true" title="Screen wake status">
                <!-- phone.png will be used as a mask/background in CSS -->
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
